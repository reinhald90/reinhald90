<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <radialGradient id="halo"><stop offset="0" stop-color="#22c55e" stop-opacity="0.35"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
    <linearGradient id="hd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#103a22"/><stop offset="1" stop-color="#082015"/></linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <circle cx="300" cy="200" r="190" fill="url(#halo)"><animate attributeName="r" values="175;195;175" dur="4s" repeatCount="indefinite"/></circle>

  <!-- chat bubbles -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.15;0.8;1" dur="6s" repeatCount="indefinite"/>
    <rect x="70" y="52" width="118" height="44" rx="16" fill="#0f2a1a" stroke="#22c55e"/>
    <path d="M150 96 l14 16 l4 -16 z" fill="#0f2a1a" stroke="#22c55e"/>
    <text x="129" y="80" text-anchor="middle" font-family="'Courier New',monospace" font-size="16" font-weight="700" fill="#4ade80">Hello!</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.4;0.9;1" dur="6s" repeatCount="indefinite"/>
    <rect x="410" y="52" width="120" height="44" rx="16" fill="#22c55e"/>
    <path d="M440 96 l-6 16 l22 -16 z" fill="#22c55e"/>
    <circle cx="450" cy="74" r="5" fill="#06140c"><animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="74" r="5" fill="#06140c"><animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="490" cy="74" r="5" fill="#06140c"><animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- robot -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- antenna -->
    <line x1="300" y1="112" x2="300" y2="84" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
    <circle cx="300" cy="76" r="9" fill="#4ade80" filter="url(#g)"><animate attributeName="r" values="7;11;7" dur="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;1;0.6" dur="1.4s" repeatCount="indefinite"/></circle>
    <!-- ears -->
    <rect x="206" y="152" width="16" height="44" rx="8" fill="#22c55e"/>
    <rect x="378" y="152" width="16" height="44" rx="8" fill="#22c55e"/>
    <!-- head -->
    <rect x="214" y="112" width="172" height="130" rx="40" fill="url(#hd)" stroke="#22c55e" stroke-width="4" filter="url(#g)"/>
    <rect x="232" y="130" width="136" height="94" rx="28" fill="#06140c"/>
    <!-- eyes -->
    <ellipse cx="270" cy="170" rx="11" ry="14" fill="#4ade80" filter="url(#g)">
      <animate attributeName="ry" values="14;14;14;1.5;14" keyTimes="0;0.6;0.66;0.7;0.76" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="330" cy="170" rx="11" ry="14" fill="#4ade80" filter="url(#g)">
      <animate attributeName="ry" values="14;14;14;1.5;14" keyTimes="0;0.6;0.66;0.7;0.76" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <!-- smile -->
    <path d="M276 202 Q300 220 324 202" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round">
      <animate attributeName="d" values="M276 202 Q300 220 324 202;M276 204 Q300 214 324 204;M276 202 Q300 220 324 202" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- neck + body -->
    <rect x="286" y="242" width="28" height="12" fill="#22c55e"/>
    <rect x="240" y="252" width="120" height="76" rx="26" fill="url(#hd)" stroke="#22c55e" stroke-width="4"/>
    <circle cx="300" cy="290" r="13" fill="none" stroke="#4ade80" stroke-width="3"/>
    <circle cx="300" cy="290" r="6" fill="#4ade80" filter="url(#g)"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <!-- arms (tap keys) -->
    <line x1="246" y1="276" x2="214" y2="340" stroke="#22c55e" stroke-width="9" stroke-linecap="round">
      <animate attributeName="y2" values="340;326;340;340" keyTimes="0;0.25;0.5;1" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="214;210;214;214" keyTimes="0;0.25;0.5;1" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="354" y1="276" x2="386" y2="340" stroke="#22c55e" stroke-width="9" stroke-linecap="round">
      <animate attributeName="y2" values="340;340;326;340" keyTimes="0;0.25;0.75;1" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="386;386;390;386" keyTimes="0;0.25;0.75;1" dur="0.9s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- keyboard -->
  <g>
    <rect x="176" y="338" width="248" height="46" rx="10" fill="#0a1a10" stroke="#22c55e" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="188" y="348" width="18" height="10" rx="3" fill="#0f2a1a"><animate attributeName="fill" values="#0f2a1a;#0f2a1a;#4ade80;#0f2a1a" keyTimes="0;0.1;0.2;1" dur="2.4s" begin="0.00s" repeatCount="indefinite"/></rect>
    <rect x="210" y="348" width="18" height="10" rx="3" fill="#0f2a1a"><animate attributeName="fill" values="#0f2a1a;#0f2a1a;#4ade80;#0f2a1a" keyTimes="0;0.8;0.9;1" dur="2.4s" begin="1.05s" repeatCount="indefinite"/></rect>
    <rect x="232" y="348" width="18" height="10" rx="3" fill="#0f2a1a"><animate attributeName="fill" values="#0f2a1a;#0f2a1a;#4ade80;#0f2a1a" keyTimes="0;0.7;0.8;1" dur="2.4s" begin="2.10s" repeatCount="indefinite"/></rect>
    <rect x="254" y="348" width="18" height="10" rx="3" fill="#0f2a1a"><animate attributeName="fill" values="#0f2a1a;#0f2a1a;#4ade80;#0f2a1a" keyTimes="0;0.6;0.7;1" dur="2.4s" begin="0.75s" repeatCount="indefinite"/></rect>
    <rect x="276" y="348" width="18" height="10" rx="3" fill="#0f2a1a"><animate attributeName="fill" values="#0f2a1a;#0f2a1a;#4ade80;#0f2a1a" keyTimes="0;0.5;0.6;1" dur="2.4s" begin="0.70s" repeatCount="indefinite"/></rect>
    <rect x="298" y="348" width="18" height="10" rx="3" fill="#0f2a1a"><animate attributeName="fill" values="#0f2a1a;#0f2a1a;#4ade80;#0f2a1a" keyTimes="0;0.4;0.5;1" dur="2.4s" begin="1.75s" repeatCount="indefinite"/></rect>
    <rect x="320" y="348" width="18" height="10" rx="3" fill="#0f2a1a"><animate attributeName="fill" values="#0f2a1a;#0f2a1a;#4ade80;#0f2a1a" keyTimes="0;0.3;0.4;1" dur="2.4s" begin="0.40s" repeatCount="indefinite"/></rect>
    <rect x="342" y="348" width="18" height="10" rx="3" fill="#0f2a1a"><animate attributeName="fill" values="#0f2a1a;#0f2a1a;#4ade80;#0f2a1a" keyTimes="0;0.2;0.3;1" dur="2.4s" begin="0.35s" repeatCount="indefinite"/></rect>
    <rect x="364" y="348" width="18" height="10" rx="3" fill="#0f2a1a"><animate attributeName="fill" values="#0f2a1a;#0f2a1a;#4ade80;#0f2a1a" keyTimes="0;0.1;0.2;1" dur="2.4s" begin="1.40s" repeatCount="indefinite"/></rect>
    <rect x="386" y="348" width="18" height="10" rx="3" fill="#0f2a1a"><animate attributeName="fill" values="#0f2a1a;#0f2a1a;#4ade80;#0f2a1a" keyTimes="0;0.8;0.9;1" dur="2.4s" begin="0.05s" repeatCount="indefinite"/></rect>
    <rect x="188" y="362" width="18" height="10" rx="3" fill="#0f2a1a"><animate attributeName="fill" values="#0f2a1a;#0f2a1a;#4ade80;#0f2a1a" keyTimes="0;0.4;0.5;1" dur="2.4s" begin="0.05s" repeatCount="indefinite"/></rect>
    <rect x="210" y="362" width="18" height="10" rx="3" fill="#0f2a1a"><animate attributeName="fill" values="#0f2a1a;#0f2a1a;#4ade80;#0f2a1a" keyTimes="0;0.3;0.4;1" dur="2.4s" begin="0.00s" repeatCount="indefinite"/></rect>
    <rect x="232" y="362" width="18" height="10" rx="3" fill="#0f2a1a"><animate attributeName="fill" values="#0f2a1a;#0f2a1a;#4ade80;#0f2a1a" keyTimes="0;0.2;0.3;1" dur="2.4s" begin="1.05s" repeatCount="indefinite"/></rect>
    <rect x="254" y="362" width="18" height="10" rx="3" fill="#0f2a1a"><animate attributeName="fill" values="#0f2a1a;#0f2a1a;#4ade80;#0f2a1a" keyTimes="0;0.1;0.2;1" dur="2.4s" begin="2.10s" repeatCount="indefinite"/></rect>
    <rect x="276" y="362" width="18" height="10" rx="3" fill="#0f2a1a"><animate attributeName="fill" values="#0f2a1a;#0f2a1a;#4ade80;#0f2a1a" keyTimes="0;0.8;0.9;1" dur="2.4s" begin="0.75s" repeatCount="indefinite"/></rect>
    <rect x="298" y="362" width="18" height="10" rx="3" fill="#0f2a1a"><animate attributeName="fill" values="#0f2a1a;#0f2a1a;#4ade80;#0f2a1a" keyTimes="0;0.7;0.8;1" dur="2.4s" begin="0.70s" repeatCount="indefinite"/></rect>
    <rect x="320" y="362" width="18" height="10" rx="3" fill="#0f2a1a"><animate attributeName="fill" values="#0f2a1a;#0f2a1a;#4ade80;#0f2a1a" keyTimes="0;0.6;0.7;1" dur="2.4s" begin="1.75s" repeatCount="indefinite"/></rect>
    <rect x="342" y="362" width="18" height="10" rx="3" fill="#0f2a1a"><animate attributeName="fill" values="#0f2a1a;#0f2a1a;#4ade80;#0f2a1a" keyTimes="0;0.5;0.6;1" dur="2.4s" begin="0.40s" repeatCount="indefinite"/></rect>
    <rect x="364" y="362" width="18" height="10" rx="3" fill="#0f2a1a"><animate attributeName="fill" values="#0f2a1a;#0f2a1a;#4ade80;#0f2a1a" keyTimes="0;0.4;0.5;1" dur="2.4s" begin="0.35s" repeatCount="indefinite"/></rect>
    <rect x="386" y="362" width="18" height="10" rx="3" fill="#0f2a1a"><animate attributeName="fill" values="#0f2a1a;#0f2a1a;#4ade80;#0f2a1a" keyTimes="0;0.3;0.4;1" dur="2.4s" begin="1.40s" repeatCount="indefinite"/></rect>
  </g>
  <text x="300" y="408" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" letter-spacing="5" fill="#4ade80" opacity="0.8">BEEP . BOOP . SHIP</text>
</svg>
